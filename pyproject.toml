[project]
name = "agent-observatory"
version = "0.1.0"
description = "Span trees, cost attribution and an automatically derived failure taxonomy for populations of agent runs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.scripts]
obs = "observatory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
web = ["fastapi>=0.109", "uvicorn>=0.27", "httpx>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/observatory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:observatory.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
